<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set raffle passwords</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
  input, button, select { font-size: 18px; padding: 10px; width: 100%; box-sizing: border-box; margin-top: 10px; }
  textarea { width: 100%; font-size: 14px; height: 80px; margin-top: 10px; box-sizing: border-box; }
</style>
</head>
<body>
<h2>Set raffle passwords</h2>
<p>Pick which password you're setting, type it, tap Generate, then paste the result into <code>app.js</code>: <code>SITE_PASSWORD_HASH</code> for the site password, <code>DEV_PASSWORD_HASH</code> for the dev mode password.</p>
<select id="kind">
  <option value="site">Site password (SITE_PASSWORD_HASH)</option>
  <option value="dev">Dev mode password (DEV_PASSWORD_HASH)</option>
</select>
<input id="pw" type="text" placeholder="New password" autocapitalize="off" autocorrect="off">
<button id="go">Generate</button>
<textarea id="out" readonly placeholder="Hash will appear here"></textarea>
<script>
document.getElementById('go').onclick = async () => {
  const pw = document.getElementById('pw').value;
  const kind = document.getElementById('kind').value;
  if (!pw) return;
  const bytes = new TextEncoder().encode('jsgd-raffle:' + kind + ':' + pw);
  const d = await crypto.subtle.digest('SHA-256', bytes);
  document.getElementById('out').value = Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
};
</script>
</body>
</html>
